<!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Sign Up - Public Hygiene Matters</title> 
    <link rel="stylesheet" href="style.css" /> 
    <script src="script.js" defer></script> 
  </head> 
  <body> 
    <div class="login-container" id="signup-container"> 
      <h2>Sign Up</h2> 
      <form id="signup-form" onsubmit="event.preventDefault(); handleSignUp();"> 
        <div class="form-group"> 
          <label for="name">Name</label> 
          <input type="text" id="name" name="name" required /> 
        </div> 
        <div class="form-group"> 
          <label for="signup-username">Username</label> 
          <input type="text" id="signup-username" name="username" required /> 
        </div> 
        <div class="form-group"> 
          <label for="signup-password">Password</label> 
          <input type="password" id="signup-password" name="password" required /> 
          <span class="toggle-password" onclick="togglePassword('signup-password')">👁</span> 
        </div> 
        <div class="form-group"> 
          <label for="signup-confirm-password">Confirm Password</label> 
          <input type="password" id="signup-confirm-password" name="confirm-password" required /> 
          <span class="toggle-password" onclick="togglePassword('signup-confirm-password')">👁</span> 
        </div> 
        <div class="form-group"> 
          <label for="city">City</label> 
          <input type="text" id="city" name="city" required /> 
        </div> 
        <div class="form-group"> 
          <label for="state">State</label> 
          <input type="text" id="state" name="state" required /> 
        </div> 
        <div class="form-group"> 
          <label for="contact">Contact No.</label> 
          <input type="tel" id="contact" name="contact" required /> 
        </div> 
        <div class="form-group"> 
          <label for="email">Email ID</label> 
          <input type="email" id="email" name="email" required /> 
        </div> 
        <button type="submit" class="login-button">Sign Up</button> 
      </form> 
    </div> 
  </body> 
</html>
